name: Build and publish to deploy branch

# Builds the app and commits the result to the `deploy` branch.
# The server pulls that branch every minute and serves it (see README).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble deploy folder
        run: |
          mkdir -p out
          cp -r dist out/site
          cp deploy/docker-compose.yml deploy/nginx.conf deploy/Caddyfile.snippet out/
      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: out
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          full_commit_message: "Deploy ${{ github.sha }}"
